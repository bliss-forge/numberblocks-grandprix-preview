<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>목업 STEP 3 — 문 앞 전달 (호수 찾기)</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="delivery-shared.css">
<style>
  .dv-hints { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .dv-hint {
    text-align: center;
    padding: 7px 10px;
    border-radius: 13px;
    background: linear-gradient(180deg, #fffaf0, #fdf0d8);
    border: 3px solid #ecd7ac;
    box-shadow: inset 0 -2px 0 rgba(200, 165, 110, .28);
    font-family: var(--display-font);
    font-size: clamp(15px, 1.85vw, 23px);
    font-weight: 900;
    color: #6f5a34;
  }
</style>
</head>
<body class="dv-mock">

<p class="mock-note"><b>목업 STEP 3 — 문 앞 전달(호수 찾기).</b> 복도 문패는 전체 호수(701·702·703)를 달고, 목표 문만 <b>금빛 링 + 별</b>로 빛난다.
오른쪽 <b>내가 찾는 호수</b>와 <b>힌트 라벨</b>이 상주해 아이가 외울 필요가 없다 — ←/→로 걷고 맞는 문 앞에서 Space로 초인종.</p>

<div class="dv-frame">

  <header class="dv-head">
    <span class="dv-step">3</span>
    <span class="dv-stepname">문 앞 전달</span>
    <p class="dv-headline">정확한 호수를 찾아 택배를 전달해요!</p>
    <span class="dv-chip dv-chip-star">⭐ <b>0</b></span>
    <span class="dv-chip dv-chip-sound">♪ 소리</span>
  </header>

  <div class="dv-body" data-cols="2">

    <div class="dv-stage">
      <svg viewBox="0 0 1100 460" preserveAspectRatio="xMidYMid slice" role="img"
           aria-label="아파트 복도. 701호, 702호, 703호 문이 있고 702호 문이 금빛으로 빛나요.">
        <defs>
          <linearGradient id="wallC" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f0dcb6"/><stop offset="1" stop-color="#e0c99e"/>
          </linearGradient>
          <linearGradient id="ceilC" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fbf1dc"/><stop offset="1" stop-color="#ecdcba"/>
          </linearGradient>
          <linearGradient id="floorC" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dcc6a0"/><stop offset="1" stop-color="#c0a67c"/>
          </linearGradient>
          <linearGradient id="doorC" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#9c6634"/><stop offset=".42" stop-color="#8a5628"/>
            <stop offset="1" stop-color="#71441f"/>
          </linearGradient>
          <linearGradient id="doorGold" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ad7439"/><stop offset=".42" stop-color="#99632d"/>
            <stop offset="1" stop-color="#7e4e22"/>
          </linearGradient>
          <linearGradient id="boxC" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e6b57e"/><stop offset="1" stop-color="#c68b4f"/>
          </linearGradient>
          <filter id="goldGlow" x="-45%" y="-45%" width="190%" height="190%">
            <feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#ffcc3d" flood-opacity="1"/>
          </filter>
          <radialGradient id="lampC" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#fffdf2"/><stop offset="1" stop-color="#ffedbe"/>
          </radialGradient>
        </defs>

        <rect width="1100" height="460" fill="#d8c096"/>

        <!-- 천장 + 조명 -->
        <polygon points="0,0 1100,0 960,62 140,62" fill="url(#ceilC)"/>
        <rect x="470" y="12" width="160" height="22" rx="9" fill="url(#lampC)" stroke="#e8d5a4" stroke-width="3"/>
        <polygon points="470,34 630,34 720,150 380,150" fill="#fff6da" opacity=".42"/>

        <!-- 좌우 벽 -->
        <polygon points="0,0 140,62 140,332 0,460" fill="#c9ad81"/>
        <polygon points="1100,0 960,62 960,332 1100,460" fill="#c9ad81"/>

        <!-- 뒷벽 · 걸레받이 -->
        <rect x="140" y="62" width="820" height="270" fill="url(#wallC)"/>
        <rect x="140" y="276" width="820" height="56" fill="#b98a56"/>
        <rect x="140" y="272" width="820" height="9" rx="4" fill="#d0a574"/>
        <line x1="140" y1="112" x2="960" y2="112" stroke="#d9c199" stroke-width="3" opacity=".85"/>

        <!-- 바닥 -->
        <polygon points="0,460 140,332 960,332 1100,460" fill="url(#floorC)"/>
        <g stroke="#b09668" stroke-width="2.5" opacity=".7">
          <line x1="140" y1="332" x2="0" y2="460"/><line x1="304" y1="332" x2="230" y2="460"/>
          <line x1="468" y1="332" x2="460" y2="460"/><line x1="632" y1="332" x2="690" y2="460"/>
          <line x1="796" y1="332" x2="920" y2="460"/><line x1="960" y1="332" x2="1100" y2="460"/>
          <line x1="112" y1="372" x2="988" y2="372"/><line x1="66" y1="418" x2="1034" y2="418"/>
        </g>
        <polygon points="400,332 700,332 760,440 340,440" fill="#fff3d4" opacity=".3"/>

        <!-- ── 문 701 ───────────────────────────────────────── -->
        <g>
          <rect x="222" y="104" width="176" height="228" rx="8" fill="#68401f"/>
          <rect x="232" y="112" width="156" height="220" rx="5" fill="url(#doorC)"/>
          <rect x="248" y="180" width="124" height="60" rx="5" fill="none" stroke="#63401e" stroke-width="4"/>
          <rect x="248" y="254" width="124" height="60" rx="5" fill="none" stroke="#63401e" stroke-width="4"/>
          <rect x="236" y="116" width="9" height="212" fill="#fff" opacity=".08"/>
          <rect x="272" y="126" width="76" height="36" rx="8" fill="#fdf6e6" stroke="#c3ab84" stroke-width="3"/>
          <text x="310" y="153" text-anchor="middle" font-size="24" font-weight="900" fill="#4a4034">701</text>
          <circle cx="374" cy="228" r="9" fill="#e8bb4f" stroke="#b8892a" stroke-width="3"/>
        </g>

        <!-- ── 문 703 ───────────────────────────────────────── -->
        <g>
          <rect x="702" y="104" width="176" height="228" rx="8" fill="#68401f"/>
          <rect x="712" y="112" width="156" height="220" rx="5" fill="url(#doorC)"/>
          <rect x="728" y="180" width="124" height="60" rx="5" fill="none" stroke="#63401e" stroke-width="4"/>
          <rect x="728" y="254" width="124" height="60" rx="5" fill="none" stroke="#63401e" stroke-width="4"/>
          <rect x="716" y="116" width="9" height="212" fill="#fff" opacity=".08"/>
          <rect x="752" y="126" width="76" height="36" rx="8" fill="#fdf6e6" stroke="#c3ab84" stroke-width="3"/>
          <text x="790" y="153" text-anchor="middle" font-size="24" font-weight="900" fill="#4a4034">703</text>
          <circle cx="854" cy="228" r="9" fill="#e8bb4f" stroke="#b8892a" stroke-width="3"/>
        </g>

        <!-- ── 문 702 (목표) ────────────────────────────────── -->
        <g>
          <rect x="452" y="94" width="196" height="248" rx="15" fill="none" stroke="#ffc93d" stroke-width="7" filter="url(#goldGlow)"/>
          <rect x="462" y="104" width="176" height="228" rx="8" fill="#68401f"/>
          <rect x="472" y="112" width="156" height="220" rx="5" fill="url(#doorGold)"/>
          <rect x="488" y="180" width="124" height="60" rx="5" fill="none" stroke="#6d461f" stroke-width="4"/>
          <rect x="488" y="254" width="124" height="60" rx="5" fill="none" stroke="#6d461f" stroke-width="4"/>
          <rect x="476" y="116" width="9" height="212" fill="#fff" opacity=".13"/>
          <rect x="512" y="126" width="76" height="36" rx="8" fill="#fffaea" stroke="#e0b45c" stroke-width="3.5"/>
          <text x="550" y="153" text-anchor="middle" font-size="24" font-weight="900" fill="#c8791b">702</text>
          <circle cx="614" cy="228" r="9" fill="#ffd45c" stroke="#c99a2c" stroke-width="3"/>
          <path transform="translate(550,66) scale(1.15)" d="M0,-19 L5.6,-6.2 L19.5,-4.6 L9.2,4.6 L12,18.4 L0,11.5 L-12,18.4 L-9.2,4.6 L-19.5,-4.6 L-5.6,-6.2 Z"
                fill="#ffd23f" stroke="#e0a80f" stroke-width="3" stroke-linejoin="round"/>
        </g>

        <!-- ── 택배원 + 상자 ────────────────────────────────── -->
        <g>
          <ellipse cx="118" cy="416" rx="94" ry="18" fill="#8a7047" opacity=".35"/>
          <image href="../assets/characters/nine.png" x="14" y="182" width="208" height="234" preserveAspectRatio="xMidYMax meet"/>
          <g transform="translate(252,372)">
            <ellipse cx="0" cy="46" rx="64" ry="13" fill="#8a7047" opacity=".33"/>
            <rect x="-62" y="-38" width="124" height="84" rx="9" fill="url(#boxC)" stroke="#a56f3c" stroke-width="4"/>
            <rect x="-62" y="-6" width="124" height="15" fill="#dba76a" opacity=".85"/>
            <rect x="-10" y="-38" width="20" height="84" fill="#dba76a" opacity=".85"/>
            <path d="M-46,-23 h30 M-46,-13 h20" stroke="#a56f3c" stroke-width="4" stroke-linecap="round" opacity=".55"/>
          </g>
        </g>
      </svg>
    </div>

    <aside class="dv-panel">
      <div class="dv-card">
        <b>내가 찾는 호수</b>
        <span class="dv-goal-num">702호</span>
      </div>
      <div class="dv-card">
        <b>힌트 라벨</b>
        <div class="dv-hints">
          <span class="dv-hint">702호</span>
          <span class="dv-hint">702호</span>
        </div>
      </div>
    </aside>

  </div>

  <footer class="dv-foot">
    <img class="dv-mascot" src="../assets/characters/nine.png" alt="">
    <div class="dv-tip">
      <span class="dv-tip-q">?</span>
      <p class="dv-tip-text"><b>게임 방법</b><br>
        라벨과 <strong>같은 호수의 문</strong>을 찾아 택배를 전달하세요!<br>
        정확히 찾으면 초인종을 누를 수 있어요.</p>
    </div>
  </footer>
</div>

</body>
</html>
